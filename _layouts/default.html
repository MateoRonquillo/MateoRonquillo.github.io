<!doctype html>
<html lang="{{ site.lang | default: 'es' }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
  <title>{% if page.title == 'Inicio' %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body><div class="site-shell">
<header class="site-header"><a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark">m<span>.</span></span><span class="brand-name">Mateo Ronquillo<small>BITÁCORA PERSONAL</small></span></a><nav aria-label="Navegación principal"><a href="{{ '/' | relative_url }}#bitacora">Bitácora</a><a href="{{ '/sobre-mi/' | relative_url }}">Sobre mí</a><a class="nav-contact" href="{{ '/' | relative_url }}#contacto">Contacto <span aria-hidden="true">↗</span></a></nav></header>
<main>{{ content }}</main>
<footer class="site-footer" id="contacto"><div><a class="brand footer-brand" href="{{ '/' | relative_url }}"><span class="brand-mark">m<span>.</span></span><span class="brand-name">Mateo Ronquillo<small>HECHO CON CURIOSIDAD ;D</small></span></a></div><div class="footer-right"><p>Un paso a la vez, una idea a la vez.</p><a href="{{ '/sobre-mi/' | relative_url }}">Sobre mí ↗</a></div><span class="footer-line">© {{ site.time | date: '%Y' }} · Sitio estático con GitHub Pages</span></footer>
</div></body></html>
